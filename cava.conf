[general]
bars = 28
framerate = 60
autosens = 1
sensitivity = 100
lower_cutoff_freq = 50
higher_cutoff_freq = 12000
noise_reduction = 0.72

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 15
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average
